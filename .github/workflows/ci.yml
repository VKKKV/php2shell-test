name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: CLI smoke test
        run: |
          python php2shell.py --help >/dev/null
          python php2shell.py gen
      - name: Validate compose
        run: docker compose -f lab/docker-compose.yml config -q
