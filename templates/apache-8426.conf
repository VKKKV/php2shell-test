# Single prefork worker: the producer and the consumer must land on the same
# process, otherwise the stale BG(serialize) state is never reused.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 1
    MaxRequestWorkers 1
    ServerLimit 1
    MaxConnectionsPerChild 0
</IfModule>
