services:
  php:
    image: php:8.2.34-fpm
    volumes:
      - ./webroot:/var/www/html:ro
      - ./php.ini:/usr/local/etc/php/php.ini:ro
    command: >
      bash -c "mkdir -p /tmp/sessions && chmod 1777 /tmp/sessions && exec php-fpm"
    tmpfs:
      - /tmp:mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  nginx:
    image: nginx:1.31.7-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT}:80"
    volumes:
      - ./webroot:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
