; Settings required by the 109619 RCE chain (9bie/php2shell-bypass-aslr-exp).
; display_errors=On is what turns the corrupted shutdown into a heap leak;
; production defaults hide it, which is why the public chain needs this lab.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = Off
memory_limit = 8M
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.use_strict_mode = 0
session.use_only_cookies = 0
session.save_handler = files
session.save_path = "/tmp"
