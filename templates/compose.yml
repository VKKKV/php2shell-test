  apache8426:
    image: php:8.4.26-apache
    profiles: ["109619-rce"]
    volumes:
      - ./webroot:/var/www/html:ro
      - ./php-8426.ini:/usr/local/etc/php/conf.d/zz-php2shell.ini:ro
      - ./apache-8426.conf:/etc/apache2/conf-enabled/zz-php2shell.conf:ro
      - ./out-rce:/out
