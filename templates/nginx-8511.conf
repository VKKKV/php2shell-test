server {
    listen 80;
    root /srv/php2shell-docroot;
    index probe.php;
    client_max_body_size 16m;

    location ~ \.php$ {
        fastcgi_pass fpm8511:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }
}
