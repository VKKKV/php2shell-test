server {
    listen 80;
    root /var/www/html;
    index index.php;
    # The race chain streams a multi-MB body; nginx defaults to 1m and would
    # answer 413 before PHP ever sees the multipart.
    client_max_body_size 16m;

    # Healthcheck target: a static 200 that never touches PHP. Pointing the
    # healthcheck at index.php created a fresh empty session file every 2s.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ \.php$ {
        # nginx buffers the whole request body by default and hands it to PHP in
        # one go, which collapses the upload window to milliseconds. Streaming
        # (common for large/streaming uploads) keeps the body arriving while PHP
        # parses it, which is what the race chain needs.
        fastcgi_request_buffering off;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
