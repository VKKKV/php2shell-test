ServerName localhost
DocumentRoot /srv/www

<Directory /srv/www>
    Require all granted
</Directory>

<FilesMatch \.php$>
    SetHandler application/x-httpd-php
</FilesMatch>

# The 109618 lab needs room for the wire body while memory_limit stays small:
# the point is that PHP's representation of the multipart headers is much
# larger than the bytes on the wire.
php_value memory_limit 16M
php_value post_max_size 32M
php_value upload_max_filesize 32M
php_value max_file_uploads 20
php_value display_errors On
php_value error_reporting 32767

# Keep the access/error logs on the container's stdout/stderr so the CLI can
# read them with `docker compose logs`.
ErrorLog /dev/stderr
CustomLog /dev/stdout combined
